<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>갤러리 | 성운목재합판</title>
  <link rel="icon" href="assets/img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>갤러리</h1>
        <p>매장과 자재, 시공 사진입니다. 사진을 누르면 크게 볼 수 있습니다.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <!-- 사진 추가: assets/img 에 파일을 넣고 아래 <a> 한 줄을 복사해서 경로·설명만 바꾸세요. -->
        <div class="gallery">
          <a class="gallery-item" href="assets/img/g1.svg" data-caption="매장 전경"><img src="assets/img/g1.svg" alt="매장 전경" loading="lazy"><span>매장 전경</span></a>
          <a class="gallery-item" href="assets/img/g2.svg" data-caption="구조목 적재"><img src="assets/img/g2.svg" alt="구조목 적재" loading="lazy"><span>구조목 적재</span></a>
          <a class="gallery-item" href="assets/img/g3.svg" data-caption="합판·MDF"><img src="assets/img/g3.svg" alt="합판 MDF" loading="lazy"><span>합판·MDF</span></a>
          <a class="gallery-item" href="assets/img/g4.svg" data-caption="방부목 데크 시공"><img src="assets/img/g4.svg" alt="방부목 데크" loading="lazy"><span>방부목 데크 시공</span></a>
          <a class="gallery-item" href="assets/img/g5.svg" data-caption="예림 중문"><img src="assets/img/g5.svg" alt="예림 중문" loading="lazy"><span>예림 중문</span></a>
          <a class="gallery-item" href="assets/img/g6.svg" data-caption="집성판"><img src="assets/img/g6.svg" alt="집성판" loading="lazy"><span>집성판</span></a>
          <a class="gallery-item" href="assets/img/g7.svg" data-caption="몰딩"><img src="assets/img/g7.svg" alt="몰딩" loading="lazy"><span>몰딩</span></a>
          <a class="gallery-item" href="assets/img/g8.svg" data-caption="합성데크"><img src="assets/img/g8.svg" alt="합성데크" loading="lazy"><span>합성데크</span></a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <a class="btn btn-primary mobile-call" data-site-tel href="#">📞 전화 문의</a>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
