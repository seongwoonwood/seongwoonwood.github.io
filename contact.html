<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문의하기 | 성운목재합판</title>
  <link rel="icon" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>문의하기</h1>
        <p>급한 문의는 전화(<a data-site-tel href="#" data-site="phone"></a>)가 가장 빠릅니다. 도면·발주서는 팩스(<span data-site="fax"></span>)나 이메일(<a data-site-mail href="#" data-site="email"></a>)로 보내주세요.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:760px">
        <form class="form" id="contact-form" novalidate>
          <div class="form-row">
            <label>이름 / 업체명 *<input name="name" required autocomplete="name"></label>
            <label>연락처 *<input name="phone" type="tel" required autocomplete="tel" placeholder="010-0000-0000"></label>
          </div>
          <div class="form-row">
            <label>이메일<input name="email" type="email" autocomplete="email"></label>
            <label>문의 종류
              <select name="type">
                <option>견적 문의</option>
                <option>재고 문의</option>
                <option>배송·양중 문의</option>
                <option>예림도어·몰딩·중문</option>
                <option>기타</option>
              </select>
            </label>
          </div>
          <label>내용 *<textarea name="message" required placeholder="품목, 규격, 수량을 적어주시면 빠르게 안내해 드립니다."></textarea></label>
          <label class="check"><input type="checkbox" name="agree" required> 답변을 위한 개인정보(이름·연락처) 수집에 동의합니다.</label>
          <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
          <div class="form-status" id="form-status" role="status"></div>
          <button class="btn btn-primary" type="submit">문의 보내기</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <a class="btn btn-primary mobile-call" data-site-tel href="#">📞 전화 문의</a>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/contact.js"></script>
</body>
</html>
